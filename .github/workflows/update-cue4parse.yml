name: Update CUE4Parse Submodule

on:
  schedule:
    # Daily check at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: dev

      - name: Check CUE4Parse upstream
        id: cue4parse
        run: |
          cd CUE4Parse
          git fetch origin master
          LATEST=$(git rev-parse origin/master)
          CURRENT=$(git rev-parse HEAD)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update submodule reference
        if: steps.cue4parse.outputs.changed == 'true'
        run: |
          cd CUE4Parse
          git checkout ${{ steps.cue4parse.outputs.latest }}

      - name: Commit and push to dev
        if: steps.cue4parse.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUE4Parse
          git commit -m "同步 CUE4Parse 子模块至 ${{ steps.cue4parse.outputs.latest }}"
          git push origin dev
