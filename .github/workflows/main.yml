name: Daily Builder

on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: .NET 10 Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore "./FModel/FModel.slnx" -r win-x64

      - name: .NET Publish
        run: dotnet publish "./FModel/FModel.csproj" -c Release --no-restore --no-self-contained -r win-x64 -f net10.0-windows -o "./FModel/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false

      - name: ZIP File
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: ${{ github.sha }}.zip # will end up in working directory not the Publish folder
          path: ./FModel/bin/Publish/FModel.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FModel-QA
          path: ${{ github.sha }}.zip
          if-no-files-found: error

      - name: Edit QA Artifact
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 'FModel QA Testing'
          body: 'Dev builds'
          tag: 'qa'
          artifacts: ${{ github.sha }}.zip
          prerelease: true
          allowUpdates: true

