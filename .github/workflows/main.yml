name: FModel Builder

on:
  workflow_dispatch:
    inputs:
      appVersion:
        description: 'FModel Version And Release Tag'
        required: true
        default: '4.0.X.X'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FModel

      - name: Publish
        run: dotnet publish FModel -c Release --no-self-contained -r win-x64 -f net10.0-windows -o "./publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false -p:AssemblyVersion=${{ github.event.inputs.appVersion }} -p:FileVersion=${{ github.event.inputs.appVersion }}

      - name: Zip
        run: Compress-Archive -Path ./publish/FModel.exe -DestinationPath FModel.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FModel v${{ github.event.inputs.appVersion }}"
          tag_name: ${{ github.event.inputs.appVersion }}
          prerelease: false
          files: FModel.zip
